[package]
name = "nanatype"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "NanaType tray typewriter"

[[bin]]
name = "nanatype"
path = "src/main.rs"

[dependencies]
dialogue.workspace = true
nana-ui.workspace = true
nana-ui-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard = "3"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
gif = "0.13"
tray-icon = "0.21"

[target.'cfg(windows)'.dependencies]
nanalive-spout = { git = "https://github.com/sena-nana/nanalive-spout.git", rev = "bdbe1d539dadae6beb0be556e9964f619fc268f3", default-features = false, features = ["cpu-dx11"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

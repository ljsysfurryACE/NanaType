[meta]
id = "nanatype.night"
version = "2.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["classic"]
name = { zh-CN = "夜色", en-US = "Night", ja-JP = "夜色" }
description = { zh-CN = "深蓝玻璃底、霓虹描边与流光下划线", en-US = "Deep-blue glass with a neon edge and a glowing underline", ja-JP = "深い青のガラスにネオンの縁取りと光るライン" }

[chrome]
appearance = "dark"
accent = "#5cb8ff"
background = "#0e1218"
surface = "#1c2531"
text = "#e6edf5"
muted = "#a6b5c7"
border = "#404f62"
success = "#48d296"
warning = "#ffc85a"
danger = "#ff7a96"

[dialogue]
padding = [26, 26, 26, 16]

[dialogue.box]
contour = "hud"
color = "#0b1220f0"
border_color = "#5cb8ff"
border_width = 1.5
radius = 16
glow = "#5cb8ff59"
glow_blur = 12
gradient = { stops = [[0, "#101c2cf2"], [1, "#0b1220f2"]] }
shadows = [{ color = "#5cb8ff30", blur = 14, inset = true }]

# Neon underline fading out at both ends.
[[dialogue.decor]]
anchor = "bottom"
offset = [0, 1]
size = ["70%", 2]
gradient = { angle = 90, stops = [[0, "#55ccff00"], [0.3, "#55ccff"], [0.7, "#a07cff"], [1, "#a07cff00"]] }
shadows = [{ color = "#5cb8ff80", blur = 6 }]
motion = { kind = "breathe", period_s = 6, amplitude = 0.12 }

[[dialogue.decor]]
color = "#7acbff99"
motif = "circuit"
anchor = "top_left"
offset = [-22, 6]
size = [64, 14]

[[dialogue.decor]]
anchor = "top_right"
offset = [-38, 9]
size = [28, 2]
color = "#5cb8ff80"

[[dialogue.decor]]
anchor = "top_right"
offset = [-72, 9]
size = [10, 2]
color = "#a07cff80"

[[dialogue.decor]]
anchor = "bottom_left"
offset = [30, -9]
size = [24, 2]
color = "#5cb8ff59"

[dialogue.text]
color = "#bae0ff"
shadow = { color = "#5cb8ff88", blur = 6 }

[dialogue.nameplate]
contour = "hud"
color = "#0b1220"
text_color = "#e4f4ff"
radius = 6
padding = [12, 3]
offset = [20, -15]
border_color = "#5cb8ff"
border_width = 1.5
shadows = [{ color = "#5cb8ff66", blur = 10 }]
text_shadow = { color = "#5cb8ff", blur = 8 }

[dialogue.continue]
color = "#5cb8ff"
motion = "blink"
period_s = 1.0

[history]
bubble_contour = "hud"
name_color = "#5cb8ff"
bubble_color = "#0b1220e6"
bubble_border = "#5cb8ff59"
bubble_radius = 12
bubble_shadows = [{ color = "#5cb8ff33", blur = 10 }]
time_color = "#84a0bc"
avatar = { shape = "circle", size = 40, ring_color = "#5cb8ff", ring_width = 1.5 }

[history.text]
color = "#d4ebff"

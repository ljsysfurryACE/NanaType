[meta]
id = "nanatype.rpg"
version = "2.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["game", "retro"]
name = { zh-CN = "RPG 窗口", en-US = "RPG Window", ja-JP = "RPGウィンドウ" }
description = { zh-CN = "蓝色渐变窗口加白色双线框，经典 RPG 消息窗", en-US = "Blue gradient window with a white double frame, the classic RPG message box", ja-JP = "青グラデーションに白い二重枠、王道RPGのメッセージ窓" }

[chrome]
appearance = "dark"
accent = "#8fa8ff"
background = "#0a1030"
surface = "#16205a"
text = "#ffffff"
muted = "#c0c8f0"
border = "#3c4a9a"
success = "#6ae09a"
warning = "#ffd060"
danger = "#ff7a7a"

[fonts.body]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[fonts.name]
file = "builtin:fonts/FusionPixel12pxProportionalSC.ttf"
families = ["Fusion Pixel 12px Proportional SC", "Zpix", "MS Gothic", "Microsoft YaHei UI", "PingFang SC"]
weight = 400

[dialogue]
padding = [26, 28, 26, 18]
overflow = "page"

[dialogue.box]
color = "#10206ee6"
border_color = "#ffffff"
border_width = 3
radius = 6
gradient = { stops = [[0, "#2840a8f0"], [1, "#0c1450f0"]] }
shadow = { color = "#000000aa", dy = 3 }

# The inner rule of the window frame.
[[dialogue.decor]]
inset = [4, 4, 4, 4]
radius = 3
border_color = "#8fa8ff"
border_width = 1

# Fusion Pixel is drawn on a 12 px grid: sizes and line heights in whole
# multiples of 12 keep every stroke on a pixel (24 px text, 36 px lines).
[dialogue.text]
color = "#ffffff"
size = 24
line_height = 1.5
shadow = { color = "#000000", dx = 2, dy = 2 }

[dialogue.nameplate]
size = 24
color = "#10206e"
text_color = "#ffffff"
radius = 4
padding = [12, 3]
offset = [14, -18]
border_color = "#ffffff"
border_width = 2
gradient = { stops = [[0, "#2840a8"], [1, "#0c1450"]] }
shadows = [{ color = "#000000aa", dy = 2 }]

[dialogue.continue]
glyph = "▼"
color = "#ffffff"
motion = "blink"
period_s = 0.9

[dialogue.reveal]
base_ms = 40

[dialogue.reveal.entrance]
kind = "none"
ms = 0

[effects]
shake_px = 2
jump_px = 4

[history]
name_color = "#ffffff"
bubble_color = "#10206ee0"
bubble_border = "#ffffff"
bubble_border_width = 2
bubble_radius = 4
bubble_gradient = { stops = [[0, "#2840a8e6"], [1, "#0c1450e6"]] }
time_color = "#c0c8f0"
avatar = { shape = "square", size = 40, ring_color = "#ffffff", ring_width = 2, radius = 4, color = "#2a3a9a" }

[history.text]
size = 24
line_height = 1.5
color = "#ffffff"
shadow = { color = "#000000", dx = 1, dy = 1 }

# Chat rows at the same 24 px, so they stay on the font's grid too.
[history.chat]
text_scale = 1.0

[meta]
id = "nanatype.livechat"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0"
tags = ["streaming"]
name = { zh-CN = "直播弹幕", en-US = "Live Chat", ja-JP = "ライブチャット" }
description = { zh-CN = "仿直播评论栏：圆形头像、名字胶囊与白色消息气泡", en-US = "Like a stream chat: round avatar, name pill and white message bubbles", ja-JP = "配信コメント欄風：丸いアイコン、名前ピル、白い吹き出し" }

[chrome]
accent = "#23ade5"
background = "#f2f7fb"
surface = "#ffffff"
text = "#1f2a36"
muted = "#5a6b7c"
border = "#d4e2ec"

[fonts.accent]
families = ["Segoe UI Symbol", "Microsoft YaHei UI", "PingFang SC"]
weight = 700

[dialogue]
region = [800, 176]
padding = [20, 42, 22, 14]

[dialogue.box]
contour = "rounded"
color = "#ffffff"
border_width = 0
radius = 18
radii = [4, 18, 18, 18]
width_fraction = 0.9
margin = [0, 0, 0, 60]
shadows = [{ color = "#1f2a3633", dy = 4, blur = 14 }]

# The round "avatar" left of the bubble.
[[dialogue.decor]]
anchor = "top_left"
offset = [-56, -2]
size = [42, 42]
radius = 22
gradient = { angle = 135, stops = [[0, "#7ed0ff"], [1, "#ff9ec4"]] }
border_color = "#ffffff"
border_width = 2
shadows = [{ color = "#1f2a3633", dy = 2, blur = 6 }]
text = "♪"
text_color = "#ffffff"
text_size = 20

# LIVE badge.
[[dialogue.decor]]
anchor = "top_right"
offset = [-14, 12]
size = [44, 20]
radius = 10
gradient = { angle = 90, stops = [[0, "#ff5c7a"], [1, "#ff8a5c"]] }
text = "LIVE"
text_color = "#ffffff"
text_size = 10

[[dialogue.decor]]
anchor = "top_right"
offset = [-65, 19]
size = [5, 5]
radius = 3
color = "#ff5c7a"

[dialogue.text]
color = "#1f2a36"
size = 26

[dialogue.nameplate]
color = "#23ade5"
text_color = "#ffffff"
size = 16
radius = 999
padding = [12, 3]
offset = [18, 12]

[dialogue.continue]
color = "#23ade5"
size = 14

[history]
bubble_contour = "rounded"
name_color = "#23ade5"
name_size = 13
bubble_color = "#ffffff"
bubble_radius = 14
bubble_radii = [4, 14, 14, 14]
bubble_border_width = 0
bubble_shadows = [{ color = "#1f2a361f", dy = 2, blur = 8 }]
name_plate = { color = "#23ade5", text_color = "#ffffff", radius = 9, padding = [9, 2] }
avatar = { shape = "circle", size = 40, ring_color = "#ffffff", ring_width = 2 }
show_time = true
time_color = "#8aa0b4"

[history.text]
color = "#1f2a36"

[effects]
# Coloured runs under 3:1 on the box get a 1.5px outline in the darkest ink.
contrast_guard = 3.0

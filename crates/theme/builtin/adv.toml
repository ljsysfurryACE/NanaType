[meta]
id = "nanatype.adv"
version = "1.0.0"
author = "NanaType"
license = "CC0-1.0"
name = { zh-CN = "ADV 经典", en-US = "ADV Classic", ja-JP = "ADVクラシック" }
description = { zh-CN = "全宽半透明黑底，视觉小说风格", en-US = "Full-width translucent black box, visual-novel style", ja-JP = "全幅の半透明ブラック、ノベルゲーム風" }

[chrome]
appearance = "dark"
accent = "#ffd27f"
background = "#101014"
surface = "#1c1c22"
text = "#f2f2f5"
muted = "#b4b4c0"
border = "#3a3a46"
success = "#64d29a"
warning = "#ffc85a"
danger = "#ff7a8a"

[dialogue]
region = [1280, 240]
padding = [48, 46, 48, 20]

[dialogue.box]
color = "#000000b3"
border_width = 0
radius = 4

[dialogue.text]
color = "#ffffff"
size = 30
line_height = 1.5
shadow = { color = "#000000cc", dx = 2, dy = 2, blur = 3 }

[dialogue.nameplate]
color = "#00000000"
text_color = "#ffd27f"
size = 22
offset = [36, 10]
padding = [6, 2]
stroke = { color = "#000000", width = 2 }

[dialogue.continue]
glyph = "▼"
color = "#ffffff"
size = 18

[dialogue.reveal.entrance]
kind = "fade"
ms = 180

[history]
name_color = "#ffd27f"
bubble_color = "#000000b0"
bubble_radius = 6
time_color = "#a0a0a8"
name_stroke = { color = "#000000", width = 1.5 }

[history.text]
color = "#ffffff"

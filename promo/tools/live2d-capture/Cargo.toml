[package]
name = "live2d-capture"
version = "0.1.0"
edition = "2024"
publish = false

# Detached from the NanaType cargo workspace: a throwaway footage tool for the promo video.
[workspace]

[dependencies]
live2d-runtime = { path = "C:/Files/workspace/live2d-rs/crates/live2d-runtime", features = ["json", "exp3", "live2d-cubism", "texture-decode"] }
live2d-wgpu = { path = "C:/Files/workspace/live2d-rs/crates/live2d-wgpu", default-features = false, features = ["asset-tools"] }
live2d-core = { path = "C:/Files/workspace/live2d-rs/crates/live2d-core" }
image = { version = "0.25.8", default-features = false, features = ["png"] }
pollster = "1.0.1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan"] }
